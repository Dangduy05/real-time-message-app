services:

  frontend:
    build: ./frontend
    container_name: frontend

  backend1:
    build: ./backend
    container_name: backend1
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
      - redis
    volumes:
      - backend_uploads:/app/uploads

  backend2:
    build: ./backend
    container_name: backend2
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
      - redis
    volumes:
      - backend_uploads:/app/uploads

  backend3:
    build: ./backend
    container_name: backend3
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
      - redis
    volumes:
      - backend_uploads:/app/uploads

  mongodb:
    image: mongo

  redis:
    image: redis

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend1
      - backend2
      - backend3

  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

volumes:
  backend_uploads:
